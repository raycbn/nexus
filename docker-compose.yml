services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-selfhosted-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER:-nexus}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-nexus}
      POSTGRES_DB: ${DATABASE_NAME:-nexus}
    volumes:
      - nexus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-nexus} -d ${DATABASE_NAME:-nexus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nexus-selfhosted-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - nexus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.35.0
    container_name: nexus-selfhosted-ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - nexus_ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:0.35.0
    container_name: nexus-selfhosted-ollama-init
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL_PRIMARY: ${OLLAMA_MODEL:-hf.co/Qwen/Qwen3-4B-GGUF:Q4_K_M}
      OLLAMA_MODEL_SECONDARY: ${OLLAMA_MODEL_SECONDARY:-qwen3:1.7b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$${OLLAMA_MODEL_PRIMARY}\" && ollama pull \"$${OLLAMA_MODEL_SECONDARY}\""]
    volumes:
      - nexus_ollama_data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-selfhosted-api
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-self-hosted}
      APP_DEBUG: ${APP_DEBUG:-false}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      AUTO_BOOTSTRAP: ${AUTO_BOOTSTRAP:-false}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-nexus}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-nexus}
      DATABASE_NAME: ${DATABASE_NAME:-nexus}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      OLLAMA_HOST: ${OLLAMA_HOST:-ollama}
      OLLAMA_PORT: ${OLLAMA_PORT:-11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-hf.co/Qwen/Qwen3-4B-GGUF:Q4_K_M}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-120}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
      NEXUS_SSO_PUBLIC_BASE_URL: ${NEXUS_SSO_PUBLIC_BASE_URL:-http://localhost:8080}
      NEXUS_VERSION: ${NEXUS_VERSION:-0.3.0}
      NEXUS_POSTGRES_CONTAINER: ${NEXUS_POSTGRES_CONTAINER:-nexus-selfhosted-postgres}
      NEXUS_REDIS_CONTAINER: ${NEXUS_REDIS_CONTAINER:-nexus-selfhosted-redis}
      NEXUS_VAULT_MASTER_KEY: ${NEXUS_VAULT_MASTER_KEY:?Set NEXUS_VAULT_MASTER_KEY in .env}
      REMEDIATION_KILL_SWITCH: ${REMEDIATION_KILL_SWITCH:-true}
      REMEDIATION_WRITES_ENABLED: ${REMEDIATION_WRITES_ENABLED:-false}
      REMEDIATION_LAB_ONLY: ${REMEDIATION_LAB_ONLY:-true}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      BILLING_SUCCESS_URL: ${BILLING_SUCCESS_URL:-http://localhost:8080/billing?success=1}
      BILLING_CANCEL_URL: ${BILLING_CANCEL_URL:-http://localhost:8080/billing?cancelled=1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  scheduled-discovery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexus-selfhosted-scheduled-discovery
    command: ["python", "-m", "apps.scheduled_discovery_worker"]
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-self-hosted}
      APP_DEBUG: ${APP_DEBUG:-false}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-nexus}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-nexus}
      DATABASE_NAME: ${DATABASE_NAME:-nexus}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: ${REDIS_DB:-0}
      NEXUS_VAULT_MASTER_KEY: ${NEXUS_VAULT_MASTER_KEY:?Set NEXUS_VAULT_MASTER_KEY in .env}
      REMEDIATION_KILL_SWITCH: ${REMEDIATION_KILL_SWITCH:-true}
      REMEDIATION_WRITES_ENABLED: ${REMEDIATION_WRITES_ENABLED:-false}
      REMEDIATION_LAB_ONLY: ${REMEDIATION_LAB_ONLY:-true}
      LAB_SSH_HOST: ${LAB_SSH_HOST:-host.docker.internal}
      LAB_SSH_PORT: ${LAB_SSH_PORT:-2222}
      LAB_SSH_USERNAME: ${LAB_SSH_USERNAME:-nexus}
      LAB_SSH_KEY_PATH: ${LAB_SSH_KEY_PATH:-infrastructure/lab/ssh_key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: nexus-selfhosted-web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nexus_postgres_data:
  nexus_redis_data:
  nexus_ollama_data:
