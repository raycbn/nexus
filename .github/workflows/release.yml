name: NEXUS Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Release preflight
        env:
          SECRET_KEY: release-validation-placeholder
          NEXUS_VAULT_MASTER_KEY: release-validation-placeholder
        run: python scripts/release/validate.py
      - name: Backend quality
        run: |
          ruff check apps packages tests
          pytest -m "not live"
      - name: Frontend quality
        working-directory: apps/web
        run: |
          npm ci
          npm run test
          npm run lint
          npm run build
      - name: Build application images
        env:
          SECRET_KEY: release-validation-placeholder
          NEXUS_VAULT_MASTER_KEY: release-validation-placeholder
        run: docker compose build api scheduled-discovery web
      - name: Build release artifacts
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix=nexus-${GITHUB_REF_NAME}/ -o dist/nexus-${GITHUB_REF_NAME}.tar.gz HEAD
          sha256sum dist/nexus-${GITHUB_REF_NAME}.tar.gz > dist/SHA256SUMS
          cp VERSION dist/VERSION
          cp CHANGELOG.md dist/CHANGELOG.md
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ github.ref_name }}
          path: dist/
