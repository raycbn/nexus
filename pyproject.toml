[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus"
version = "0.1.0"
description = "NEXUS - Multi-tenant AI Operations Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "typing-extensions>=4.12.0",
    "ollama>=0.3.0,<1.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

[tool.pytest.ini_options]
testpaths = ["tests", "infrastructure/lab/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error::DeprecationWarning",
]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = [
    "live: marks tests that require a running Ollama server with the configured model",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "packages", "tests"]

[tool.ruff.per-file-ignores]
"packages/fault_injection/scenarios.py" = ["TRY201"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = [
    "B008",
    "N818",
]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.mypy.paths]
mypy_path = ["packages", "apps"]
