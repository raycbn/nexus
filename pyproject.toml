[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus"
version = "0.3.0"
description = "NEXUS - Multi-tenant AI Operations Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "mcp>=2.0.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "typing-extensions>=4.12.0",
    "ollama>=0.3.0,<1.0",
    "redis>=5.0,<7.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "asyncssh>=2.17.0",
    "python-tds>=1.15.0",
    "pyvmomi>=8.0.3",
    "boto3>=1.35.0",
    "azure-identity>=1.19.0",
    "azure-mgmt-resource>=23.2.0",
    "google-cloud-compute>=1.19.0",
    "alembic>=1.12.0",
    "python-jose>=3.3.0",
    "passlib>=1.7.4",
    "bcrypt>=4.2.0",
    "croniter>=6.0.0",
    "cryptography>=43.0.0",
    "Authlib>=1.3,<2",
    "python3-saml>=1.16,<2",
    "python-multipart>=0.0.9",
    "stripe>=12,<13",
]
[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "psycopg2-binary>=2.9.0",
    "asyncpg>=0.29.0",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "packages"]

[tool.pytest.ini_options]
testpaths = ["tests", "infrastructure/lab/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error::DeprecationWarning",
]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = [
    "live: marks tests that require a running Ollama server with the configured model",
]
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "packages", "tests"]

[tool.ruff.lint]
per-file-ignores = { "packages/fault_injection/scenarios.py" = ["TRY201"] }
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "N818"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
